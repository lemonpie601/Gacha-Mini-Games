<style>
  /* 말랑's five presets: card, outline, text, ground, highlight, accent. */
  :root, :root[data-preset="cream"] { --gfx-card:#FFFDF5; --gfx-line:#6B4528; --gfx-text:#5A3A24; --gfx-ink:#FFF4D9; --gfx-pick:#FFE17A; --gfx-accent:#F0763A; --page:#F6E7CC; }
  :root[data-preset="berry"] { --gfx-card:#FFF8FA; --gfx-line:#7A2E45; --gfx-text:#6A2E45; --gfx-ink:#FFE4EC; --gfx-pick:#FFD3E0; --gfx-accent:#F2557F; --page:#FBD9E3; }

  :root[data-preset="lavender"] { --gfx-card:#FCFBFF; --gfx-line:#4F3F85; --gfx-text:#43356F; --gfx-ink:#EFE8FF; --gfx-pick:#DCD0FF; --gfx-accent:#8C6CF0; --page:#E2D8FA; }
  :root[data-preset="night"] { --gfx-card:#2A2E4D; --gfx-line:#14162A; --gfx-text:#F0EEFF; --gfx-ink:#22253D; --gfx-pick:#4A4F80; --gfx-accent:#FFB84D; --page:#171A2E; }
  /* Gacha Forge's own five UI styles: the tokens the game sets on its arena; the games dress themselves from them. */
  :root[data-preset^="gf-"] { --body:"Segoe UI", system-ui, -apple-system, sans-serif; }
  :root[data-preset="gf-base"] { --surface:#EDF1F6; --on-surface:#23374F; --text:#EDF1F6; --ink-2:#151D2C; --ground-1:#17212F; --steel:#4A6E96; --steel-dark:#23374F; --steel-faint:#8AA2BC; --coral:#F2603C; --radius:0px; --radius-sm:0px; --page:#0B1119; }
  :root[data-preset="gf-aurora"] { --surface:rgba(255,255,255,0.09); --on-surface:#F0EAFB; --text:#EDE8FA; --ink-2:#171334; --ground-1:#171334; --steel:#A98BE0; --steel-dark:#3A2E63; --steel-faint:#AEA0CE; --coral:#E8C87A; --radius:14px; --radius-sm:8px; --page:#07060F; }
  :root[data-preset="gf-bloom"] { --surface:#FFFFFF; --on-surface:#16233A; --text:#EAF1FC; --ink-2:#1D2B45; --ground-1:#2B3F63; --steel:#6E86AE; --steel-dark:#45566F; --steel-faint:#C3D2E8; --coral:#528CF7; --radius:20px; --radius-sm:12px; --page:#1D2B45; }
  :root[data-preset="gf-signal"] { --surface:rgba(255,255,255,0.06); --on-surface:#E8EAEE; --text:#FFFFFF; --ink-2:#0C0D10; --ground-1:#0C0D10; --steel:#9AA1AC; --steel-dark:#2A2E36; --steel-faint:#8B929C; --coral:#C8FF3D; --radius:2px; --radius-sm:2px; --page:#08090B; }
  :root[data-preset="gf-ember"] { --surface:#53381F; --on-surface:#F0D9A8; --text:#F5E7CE; --ink-2:#241811; --ground-1:#3A2A1E; --steel:#C89A4A; --steel-dark:#7A5730; --steel-faint:#BC9C70; --coral:#F0B429; --radius:18px; --radius-sm:10px; --page:#170F0B; }
  :root[data-preset^="gf-"] header { color:var(--text); }

  html, body { margin:0; height:100%; }

  header { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 16px 0; }
  h1 { margin:0; font-size:1.35em; font-weight:normal; }
  h1 small { font-size:.6em; opacity:.6; margin-left:.4em; }

  select { font:inherit; color:var(--gfx-text); background:var(--gfx-card); border:2.5px solid var(--gfx-line); border-radius:999px; padding:.2em .8em; box-shadow:0 2px 0 var(--gfx-line); }
  #games { flex:1; min-height:520px; display:block; padding:10px 12px 12px; }
</style>

<body>
<header>
  <h1>🎮 Gacha Mini Games<small>v1.8.0</small></h1>
  <label>테마
    <select id="preset">
      <option value="cream">크림 코코아</option>
      <option value="berry">딸기 우유</option>
      <option value="mint">민트 초코</option>
      <option value="lavender">라벤더</option>
      <option value="night">밤하늘</option>
      <optgroup label="가챠 포지 UI 스타일">
        <option value="gf-base">기본</option>
        <option value="gf-aurora">오로라</option>
        <option value="gf-bloom">블룸</option>
        <option value="gf-signal">시그널</option>
        <option value="gf-ember">엠버</option>
      </optgroup>
    </select>
  </label>
</header>
<div id="games"></div>
<script>
/* Gacha Mini Games v1.6.0 — personal extension for Gacha Forge on Marinara Engine.
 * While a chapter or story is being generated, the generation screen gets a column of small games on its right:
 * 지뢰찾기, 사과 상자 (the fruit follows the 말랑 colour preset), 2048, 짝 맞추기, 쿠키 가게, 디저트 핀볼 and more. Closing the column or
 * finishing generation removes them; nothing here touches the run, rewards or the generation request.
 * Split out of Gacha UI Style · 말랑 (1.12.0). Works on its own; with 말랑 on it takes 말랑's colours, preset and
 * SD sprites; without it, the colours and corners of the game's own UI style. Short synthesized hit sounds follow
 * Gacha Forge Sound's volume when it is installed. Best records live in this browser only. */
(() => {
  "use strict";
  const KEY = "__GF_MINIGAMES_EXTENSION";
  if (typeof window[KEY] === "function") {
    try { window[KEY](); } catch {}
  }
  const HOST_TAG = "marinara-capability-gacha-forge";
  const MARINARA = typeof marinara !== "undefined" && marinara ? marinara : null;
  const life = new AbortController();
  const on = (target, type, fn, opts = {}) => target.addEventListener(type, fn, { ...opts, signal: life.signal });
  const el = (tag, cls = "", text = "") => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  let disposed = false;

  /* Loading games: local UI state only; never touch the run, rewards or generation request. */
  function newMineGame(random = Math.random, difficulty = "easy") {
    const [cols, mines] = ({ easy: [8, 10], normal: [10, 18], hard: [12, 30] })[difficulty] || [8, 10];
    const cells = Array.from({ length: cols * cols }, () => ({ mine: false, open: false, flag: false, count: 0 }));
    const game = { cells, cols, rows: cols, mines, started: false, ended: false, won: false, boom: -1 };
    const neighbours = (i) => cells.map((_, j) => j).filter((j) => j !== i && Math.abs(j % cols - i % cols) <= 1 && Math.abs(Math.floor(j / cols) - Math.floor(i / cols)) <= 1);
    game.neighbours = neighbours;
    game.flag = (i) => { if (!game.ended && !cells[i].open) cells[i].flag = !cells[i].flag; };
    game.reveal = (i) => {
      if (game.ended || cells[i].flag || cells[i].open) return;
      if (!game.started) {
        const safe = new Set([i, ...neighbours(i)]), pool = cells.map((_, j) => j).filter((j) => !safe.has(j));
        for (let k = 0; k < mines; k++) { const at = k + Math.floor(random() * (pool.length - k)); [pool[k], pool[at]] = [pool[at], pool[k]]; cells[pool[k]].mine = true; }
        cells.forEach((c, j) => c.count = neighbours(j).filter((n) => cells[n].mine).length);
        game.started = true;
      }
      if (cells[i].mine) { cells[i].open = true; game.ended = true; game.boom = i; return; }
      const queue = [i];
      while (queue.length) { const j = queue.pop(), c = cells[j]; if (c.open || c.flag || c.mine) continue; c.open = true; if (!c.count) queue.push(...neighbours(j)); }
      if (cells.filter((c) => c.open).length === cells.length - mines) { game.ended = true; game.won = true; }
    };
    // Pressing an opened number whose flags are all placed opens the rest around it (as in the classic game).
    game.chord = (i) => {
      const c = cells[i];
      if (game.ended || !c.open || !c.count) return;
      const around = neighbours(i);
      if (around.filter((j) => cells[j].flag).length !== c.count) return;
      for (const j of around) { game.reveal(j); if (game.ended) return; }
    };
    return game;
  }
  function newFruitGame(random = Math.random, difficulty = "normal") {
    const [cols, rows, max, time] = ({ easy: [8, 6, 5, 180], normal: [10, 8, 9, 120], hard: [12, 10, 9, 90] })[difficulty] || [10, 8, 9, 120];
    const game = { cols, rows, time, cells: Array.from({ length: cols * rows }, () => 1 + Math.floor(random() * max)), score: 0, ended: false };
    game.cells[0] = max === 5 ? 5 : 1; game.cells[1] = 10 - game.cells[0]; // Every new board has at least one legal selection.
    game.select = (a, b, remove = false) => {
      const x0 = Math.min(a % cols, b % cols), x1 = Math.max(a % cols, b % cols), y0 = Math.min(Math.floor(a / cols), Math.floor(b / cols)), y1 = Math.max(Math.floor(a / cols), Math.floor(b / cols));
      const ids = game.cells.map((_, i) => i).filter((i) => i % cols >= x0 && i % cols <= x1 && Math.floor(i / cols) >= y0 && Math.floor(i / cols) <= y1);
      const sum = ids.reduce((n, i) => n + game.cells[i], 0);
      if (remove && sum === 10 && !game.ended) { game.score += ids.filter((i) => game.cells[i]).length; ids.forEach((i) => game.cells[i] = 0); }
      return { ids, sum };
    };
    // A rectangle that still sums to 10 (for the hint, and to end a board with nothing left to clear).
    game.findMove = () => {
      const sum = (x0, y0, x1, y1) => { let n = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) n += game.cells[y * cols + x]; return n; };
      for (let y0 = 0; y0 < rows; y0++) for (let x0 = 0; x0 < cols; x0++) for (let y1 = y0; y1 < rows; y1++) {
        if (sum(x0, y0, x0, y1) > 10) break;
        for (let x1 = x0; x1 < cols; x1++) { const s = sum(x0, y0, x1, y1); if (s === 10) return { a: y0 * cols + x0, b: y1 * cols + x1 }; if (s > 10) break; }
      }
      return null;
    };
    return game;
  }
  function new2048Game(random = Math.random, difficulty = "normal") {
    const [size, goal] = ({ easy: [5, 2048], normal: [4, 2048], hard: [3, 256] })[difficulty] || [4, 2048];
    const cells = Array(size * size).fill(0);
    const game = { size, cols: size, goal, cells, score: 0, ended: false, won: false, fresh: -1, merged: [] };
    const spawn = () => {
      const empty = cells.map((v, i) => v ? -1 : i).filter((i) => i >= 0);
      if (!empty.length) { game.fresh = -1; return; }
      const i = empty[Math.floor(random() * empty.length)];
      cells[i] = random() < 0.9 ? 2 : 4; game.fresh = i;
    };
    // The cells of one row or column, listed from the side the tiles slide towards.
    const line = (k, dir) => Array.from({ length: size }, (_, i) => dir === "left" ? k * size + i : dir === "right" ? k * size + size - 1 - i : dir === "up" ? i * size + k : (size - 1 - i) * size + k);
    game.canMove = () => cells.some((v, i) => !v || (i % size < size - 1 && cells[i + 1] === v) || (i + size < cells.length && cells[i + size] === v));
    game.move = (dir) => {
      if (game.ended) return false;
      let moved = false; game.merged = [];
      for (let k = 0; k < size; k++) {
        const idx = line(k, dir), vals = idx.map((i) => cells[i]).filter(Boolean), out = [], merged = [];
        for (let j = 0; j < vals.length; j++) {
          if (j + 1 < vals.length && vals[j] === vals[j + 1]) { const v = vals[j] * 2; out.push(v); merged.push(out.length - 1); game.score += v; if (v >= goal) game.won = true; j++; }
          else out.push(vals[j]);
        }
        idx.forEach((i, p) => { const v = out[p] || 0; if (cells[i] !== v) moved = true; cells[i] = v; });
        game.merged.push(...merged.map((p) => idx[p]));
      }
      if (moved) spawn(); else game.fresh = -1;
      if (!game.canMove()) game.ended = true;
      return moved;
    };
    spawn(); spawn();
    return game;
  }
  const MEMORY_SYMBOLS = ["🍎", "🍋", "🍇", "🍓", "🍑", "🍒", "🥝", "🍍", "🍉", "🍊", "🫐", "🥥"];
  function newMemoryGame(random = Math.random, difficulty = "easy", faces = []) {
    const [cols, pairs] = ({ easy: [4, 6], normal: [4, 8], hard: [6, 12] })[difficulty] || [4, 6];
    const shuffle = (list) => { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    // The world's own SD characters are the cards; fruit fills in when there are fewer of them than pairs.
    const pool = [...shuffle([...new Set(faces)]).slice(0, pairs), ...MEMORY_SYMBOLS].slice(0, pairs);
    const cells = shuffle([...pool, ...pool]).map((face) => ({ face, open: false, done: false }));
    const game = { cols, rows: cells.length / cols, pairs, cells, moves: 0, ended: false, won: false };
    game.flip = (i) => {
      const c = cells[i];
      if (game.ended || c.open || c.done) return "ignored";
      const up = cells.map((x, j) => x.open && !x.done ? j : -1).filter((j) => j >= 0);
      if (up.length >= 2) return "busy";
      c.open = true;
      if (!up.length) return "open";
      game.moves++;
      const other = cells[up[0]];
      if (other.face !== c.face) return "miss";
      other.done = c.done = true;
      if (cells.every((x) => x.done)) game.ended = game.won = true;
      return "match";
    };
    game.hide = () => cells.forEach((x) => { if (x.open && !x.done) x.open = false; });
    return game;
  }
  /* More games: 쿠키 가게, 디저트 핀볼, 비스킷 벽돌깨기, 젤리 블록, 스네이크, 딸기 우유 레시피, 초코칩 터뜨리기, 꽃밭 퍼즐, 별 밝히기. */
  // 쿠키 가게, in the manner of 슈의 라면집. Guests queue at the counter (three at most), each with an order — plain,
  // chocolate chip, cream or both — and a patience that runs out. An oven goes: butter the tray → light it → wait for
  // the preheat lamp → dough → sugar → bake. While the cookie is golden (it steams), top it as ordered, then plate it:
  // the guest who ordered that cookie takes it (else whoever waited longest) and pays by how it was made (game.judge),
  // plus a tip when it came quickly. A lit oven left too long — empty or not — burns: clearing it uses one of three
  // spares, and with no spare left that oven is gone. A guest who gives up costs a heart. Reach the day's goal to win;
  // run out of hearts or ovens and the shop closes. Time is passed in (now), so the game can be paused by shifting it.
  const SHOP_TOOLS = [["butter", "버터"], ["fire", "불 켜기"], ["dough", "반죽"], ["sugar", "설탕"], ["chip", "초코칩"], ["cream", "크림"], ["serve", "접시"]];
  const SHOP_ORDERS = { plain: "플레인", chip: "초코칩", cream: "크림", both: "스페셜" };
  function newShopGame(random = Math.random, difficulty = "normal") {
    // preheat, bake, golden, over, empty oven burns after, goal, a guest every, patience, hearts
    const [heat, bake, ready, over, empty, goal, every, patience, hearts] = ({
      easy: [1500, 5000, 4500, 3500, 9000, 6000, 9000, 34000, 5],
      normal: [1500, 4000, 3500, 2500, 7000, 10000, 7000, 26000, 4],
      hard: [1200, 3500, 2600, 2000, 5500, 15000, 5500, 20000, 3],
    })[difficulty] || [1500, 4000, 3500, 2500, 7000, 10000, 7000, 26000, 4];
    const fresh = () => ({ butter: false, lit: null, dough: null, flat: false, sugar: false, chip: "", cream: "" });
    const game = { heat, bake, ready, over, empty, goal, patience, hearts, ovens: [fresh(), fresh(), fresh(), fresh()], spares: 3, money: 0, tips: 0, served: 0, perfect: 0, left: 0,
      queue: [], guests: 0, next: 0, opened: null, ended: false, won: false, last: null };
    // cold → heat (preheating) → hot (ready for dough) → burnt; with dough: raw → ready (golden) → over → burnt.
    game.stage = (o, now) => {
      if (o === null) return "gone";
      if (o.lit == null) return "";
      if (o.dough == null) { const t = now - o.lit; return t < heat ? "heat" : t < empty ? "hot" : "burnt"; }
      const t = now - Math.max(o.dough, o.lit);
      return t < bake ? "raw" : t < bake + ready ? "ready" : t < bake + ready + over ? "over" : "burnt";
    };
    // How far the oven's dial has turned, 0–1: the bake once there is dough, else how close the empty oven is to burning.
    game.dial = (o, now) => !o || o.lit == null ? 0 : Math.min(1, o.dough == null ? (now - o.lit) / empty : (now - Math.max(o.dough, o.lit)) / (bake + ready + over));
    const lost = (o) => o === null;
    const want = () => ["plain", "chip", "cream", "both"][Math.floor(random() * 4)];
    game.open = (now) => { if (game.opened != null) return; game.opened = now; game.next = now; game.update(now); };
    // Guests come and go with the clock.
    game.update = (now) => {
      if (game.ended || game.opened == null) return;
      for (const g of game.queue.slice()) {
        if (now - g.came < patience) continue;
        game.queue.splice(game.queue.indexOf(g), 1); game.left++; game.hearts--;
        game.last = { line: "너무 오래 기다렸어… 갈래!", price: null, gone: true, guest: g.id, want: g.want };
      }
      if (game.hearts <= 0) { game.ended = true; return; }
      if (!game.queue.length) game.next = Math.min(game.next, now + 1500);
      if (game.queue.length < 3 && now >= game.next) { game.queue.push({ id: game.guests++, want: want(), came: now }); game.next = now + every * (0.75 + random() * 0.5); }
    };
    game.shift = (dt) => {
      for (const o of game.ovens) if (o) { if (o.lit != null) o.lit += dt; if (o.dough != null) o.dough += dt; }
      for (const g of game.queue) g.came += dt;
      game.next += dt; if (game.opened != null) game.opened += dt;
    };
    game.use = (tool, i, now) => {
      const o = game.ovens[i];
      if (game.ended || lost(o)) return "";
      const st = game.stage(o, now);
      if (st === "burnt") {
        // A burnt oven is cleared with a spare, or gone for good.
        if (game.spares > 0) { game.spares--; game.ovens[i] = fresh(); return "cleared"; }
        game.ovens[i] = null;
        if (game.ovens.every(lost)) game.ended = true;
        return "gone";
      }
      if (tool === "butter") { if (o.butter || o.dough != null) return ""; o.butter = true; return "butter"; }
      if (tool === "fire") { if (o.lit != null) return ""; o.lit = now; return "fire"; }
      // Dough in a cold or still-heating oven bakes flat.
      if (tool === "dough") { if (o.dough != null) return ""; o.dough = now; o.flat = !(o.lit != null && now - o.lit >= heat); return "dough"; }
      if (tool === "sugar") { if (o.sugar || o.dough == null) return ""; o.sugar = true; return "sugar"; }
      if (tool === "chip" || tool === "cream") { if (o[tool] || o.dough == null || o.lit == null) return ""; o[tool] = st === "ready" ? "ontime" : st === "raw" ? "early" : "late"; return tool; }
      if (tool === "serve") {
        if (o.dough == null) return "";
        if (!game.queue.length) return "nobody";
        const kind = game.kind(o), guest = game.queue.find((g) => g.want === kind) || game.queue[0];
        const r = game.judge(o, st, guest.want, now - guest.came);
        game.queue.splice(game.queue.indexOf(guest), 1);
        game.money += r.price; game.tips += r.tip; game.served++; if (r.perfect) game.perfect++;
        game.last = { ...r, guest: guest.id, want: guest.want, oven: i };
        game.ovens[i] = fresh();
        if (game.money >= goal) game.ended = game.won = true;
        return "served";
      }
      return "";
    };
    game.kind = (o) => o.chip && o.cream ? "both" : o.chip ? "chip" : o.cream ? "cream" : "plain";
    // The price: 1,000 for a golden cookie made right, less for each slip; the worst slip is what the guest says.
    game.judge = (o, st, order, waited) => {
      if (o.lit == null) return { price: 0, tip: 0, perfect: false, line: "이건 그냥 반죽이잖아!" };
      const slips = [];
      if (st === "raw") slips.push([700, "덜 익었잖아!"]);
      if (st === "over") slips.push([400, "좀 딱딱한데?"]);
      if (!o.butter) slips.push([200, "바닥이 눌어붙었어."]);
      if (o.flat) slips.push([200, "납작하네… 예열은 했어?"]);
      if (!o.sugar) slips.push([300, "하나도 안 달아!"]);
      for (const [k, name] of [["chip", "초코칩"], ["cream", "크림"]]) {
        const wanted = order === k || order === "both";
        if (wanted && !o[k]) slips.push([250, name + "이 없잖아!"]);
        else if (!wanted && o[k]) slips.push([150, name + "은 안 시켰는데?"]);
        else if (o[k] === "early") slips.push([100, name + "이 녹아 버렸어."]);

:is(.gfx-game-board[data-kind="drop"] > div, .gfx-drop-minigrid > i):is([data-c="7"], [data-ghost="7"]) { --c:var(--j7); }
.gfx-game-board[data-kind="drop"] > .gfx-drop-fx { position:absolute; inset:6px; aspect-ratio:auto; display:block; border-radius:0 !important; background:none; pointer-events:none; z-index:2; }
.gfx-drop-fx > i { position:absolute; left:-2px; right:-2px; top:calc(var(--y) * 5%); height:5%; border-radius:6px; background:#fff; animation:gfx-drop-melt .4s ease-out forwards; }
@keyframes gfx-drop-melt { 0% { opacity:.95; scale:1 1; } 40% { opacity:.9; scale:1.04 1.5; } 100% { opacity:0; scale:1.1 .2; } }
.gfx-drop-side { flex:0 0 4.8em; display:flex; flex-direction:column; gap:6px; }
.gfx-drop-mini { padding:4px 6px 6px; text-align:center; font-size:.78em; border:2px solid var(--gfx-line, #6B4528); border-radius:min(12px, var(--gfx-r, 22px));
  background:color-mix(in srgb,var(--gfx-line, #6B4528) 14%,var(--gfx-ink, #FFF4D9)); }
.gfx-drop-mini > b { display:block; min-height:1.1em; font-weight:normal; }
.gfx-drop-mini > b:empty { display:none; }
.gfx-drop-mini[data-dim] { opacity:.45; }
.gfx-drop-minigrid { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; margin-top:3px; }
.gfx-drop-minigrid[data-w="3"] { translate:12.5% 0; }
.gfx-drop-minigrid > i { aspect-ratio:1; border-radius:30%; }
.gfx-drop-pad { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-top:10px; touch-action:none; user-select:none; -webkit-user-select:none; }
.gfx-drop-pad button { min-width:2.7em; padding:.3em .6em !important; touch-action:none; }
.gfx-drop-pad [data-main] { background:var(--gfx-accent, #F0763A) !important; color:#fff !important; }
.gfx-drop-toast { position:absolute; left:50%; top:34%; translate:-50% 0; z-index:3; pointer-events:none; white-space:nowrap; opacity:0; font-size:1.45em; color:#fff;
  -webkit-text-stroke:1px var(--gfx-line, #6B4528); paint-order:stroke fill; text-shadow:0 3px 0 var(--gfx-line, #6B4528); }
.gfx-drop-toast[data-go] { animation:gfx-drop-toast 1s ease-out forwards; }
@keyframes gfx-drop-toast { 0% { opacity:0; scale:.6; } 15% { opacity:1; scale:1.18; } 30% { scale:1; } 75% { opacity:1; } 100% { opacity:0; translate:-50% -36px; } }
@media (max-width:600px) { .gfx-drop-side { flex-basis:3.6em; } .gfx-drop-row { gap:6px; } .gfx-game-board[data-kind="drop"] { --fit:.36 !important; } .gfx-drop-pad { gap:4px; } .gfx-drop-pad button { min-width:2.3em; } }
`;
  let sheet = null;
  const styleSheet = () => { if (!sheet) { sheet = new CSSStyleSheet(); sheet.replaceSync(CSS + CSS_MORE); } return sheet; };
  /* Standalone page: the column fills the page; the picked preset is set on the host, where 말랑 would put it. */
  const host = document.getElementById("games");
  const wrap = el("div");
  const shadow = host.attachShadow({ mode: "open" });
  const page = new CSSStyleSheet();
  page.replaceSync(":host(:not([data-game-large])) { position:relative; inset:auto; width:100%; height:100%; } :host(:not([data-game-large])) .gfx-load-games { --room:calc(100cqh - 150px); }"
    // Phones: the game list becomes one scrolling row above the game.
    + "@media (max-width:640px) { .gfx-load-games { flex-direction:column; align-items:stretch; --room:calc(100cqh - 260px); }"
    + " .gfx-game-nav { flex:none; display:flex; flex-direction:row; overflow-x:auto; overflow-y:hidden; max-height:none; padding:5px; gap:5px; }"
    + " .gfx-game-tab { flex:0 0 4.4em; } .gfx-game-utils { display:none; } .gfx-game-content { flex:1; min-height:0; padding:8px; } }");
  wrap.attachShadow({ mode: "open" });
  shadow.append(wrap);
  const inner = new CSSStyleSheet();
  inner.replaceSync(":host { display:block; height:100%; container-type:size; }");
  shadow.adoptedStyleSheets = [inner];
  wrap.shadowRoot.adoptedStyleSheets = [styleSheet(), page];
  const panel = makeLoadingGames(wrap);
  wrap.shadowRoot.append(panel);
  const pick = document.getElementById("preset");
  const apply = () => {
    host.setAttribute("data-gfx-preset", pick.value);
    document.documentElement.dataset.preset = pick.value;
    try { localStorage.setItem("gfx-games-preset", pick.value); } catch {}
    panel.retheme();
  };
  try { const saved = localStorage.getItem("gfx-games-preset"); if (saved && [...pick.options].some((o) => o.value === saved)) pick.value = saved; } catch {}
  on(pick, "change", apply);
  apply();
  panel.querySelector('[data-game="shop"]')?.click();
})();
</script>
